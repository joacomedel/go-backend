[project]
name = "go-backend"
default_policy = "auto"

# El toolchain oficial vive en /opt/go. Las cachés quedan fuera del snapshot
# para que una corrida nueva no recomponga todo desde cero.
[env]
PATH = "/opt/go/bin:/usr/local/bin:/usr/bin:/bin"
GOCACHE = "/var/tmp/devctl/go-build"
GOMODCACHE = "/var/tmp/devctl/go-mod"
GOTOOLCHAIN = "local"
GOMAXPROCS = "2"
CGO_ENABLED = "0"

[limits]
memory_max = "768M"
cpu_quota = "200%"
timeout = "180s"
max_parallel = 1

[tasks.fmt]
kind = "format"
weight = "light"
run = "test -z \"$(gofmt -l .)\""
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.vet]
kind = "lint"
weight = "light"
run = "go vet ./..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.test]
kind = "test"
weight = "light"
run = "go test -count=1 ./..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.build]
kind = "build"
weight = "medium"
run = "mkdir -p bin && go build -trimpath -o bin/api ./cmd/api"
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

# El detector de carreras necesita cgo/gcc: en el Moto no está instalado,
# así que se deriva a PC o CI. En CI corre en x86 y ARM64.
[tasks.test-race]
kind = "test"
weight = "medium"
run = "go test -race -count=1 ./..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go", "gcc"] }
env = { CGO_ENABLED = "1" }
